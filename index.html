<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevrolet Horizontal Banner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="horizontal-banner">
        <a href="https://www.bannisterchevkamloops.com/" target="_blank"> 
            <img src="logo.png" class="logo" alt="Chevrolet">
        </a>

        <div class="left-content">
            <div class="title-area">
                <h2 class="discover-title">DISCOVER THE <br><span id="carName">EQUINOX EV RS</span></h2>
                <a id="discoverLink" href="#" target="_blank" class="discover-btn">Discover more</a>
            </div>

            <div class="gauge-section" id="clickableArea">
                <div class="gauge-wrapper">
                    <canvas id="gauge" width="300" height="300"></canvas>
                    <div class="price-container">
                        <span class="prefix">FROM</span>
                        <div class="main-price">
                            <span class="currency">$</span>
                            <h1 id="priceLabel">500</h1>
                        </div>
                        <div class="suffix-box">
                            <span class="suffix">Monthly</span>
                            <span class="suffix">rentals</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-content">
            <div class="car-showcase">
                <img src="Picture2.png" class="car-img active" alt="2025 Chevrolet TrailBlazer LT">
                <img src="Picture3.png" class="car-img" alt="2023 Chevrolet Silverado 1500 Custom Trail Boss">
                <img src="Picture4.png" class="car-img" alt="2022 Chevrolet Silverado 3500HD LT">
                <img src="Picture5.png" class="car-img" alt="2024 Chevrolet Silverado 2500HD LT">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
